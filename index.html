# Полный index.html (восстановленная стабильная версия)

```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зарплата Магнит</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.header{
    background:#e30613;
    color:white;
    text-align:center;
    padding:16px;
    font-size:20px;
    font-weight:bold;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.page{
    padding:16px;
    padding-bottom:100px;
}

.hidden{
    display:none;
}

.block{
    background:white;
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

input,select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #ddd;
    box-sizing:border-box;
}

button{
    border:none;
    border-radius:12px;
    padding:12px;
    background:#e30613;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.btn-secondary{
    background:#eee;
    color:#333;
}

.result{
    background:#f1f8e9;
    padding:14px;
    border-radius:12px;
    line-height:1.6;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    display:flex;
    background:white;
    border-top:1px solid #ddd;
}

.bottom-nav button{
    flex:1;
    border-radius:0;
    background:none;
    color:#666;
}

.bottom-nav button.active{
    color:#e30613;
    font-weight:bold;
}

.day{
    padding:10px;
    border-radius:10px;
    margin-bottom:6px;
    cursor:pointer;
}

.work{
    background:#c8e6c9;
}

.off{
    background:#ffcdd2;
}
</style>
</head>
<body>

<div class="header">
📦 Зарплата кладовщика / отборщика Магнит
</div>

<div id="userInfo"
style="background:white;padding:10px;text-align:center;font-size:14px;border-bottom:1px solid #ddd;">
Загрузка пользователя...
</div>

<!-- КАЛЬКУЛЯТОР -->
<div id="calc" class="page">

<div class="block">
<input type="date" id="date">

<input type="number" id="hours" placeholder="Количество часов">

<label style="display:flex;align-items:center;gap:10px;">
<input type="checkbox" id="holiday" style="width:auto;">
🎉 Праздничный день (часы ×2)
</label>
</div>

<div class="block">
<h3>📦 Пики</h3>
<div id="picks"></div>
<button onclick="addPick()">Добавить склад</button>
</div>

<div class="block">
<h3>🚛 Развоз телег</h3>
<input type="number" id="carts" placeholder="Количество телег">
</div>

<div style="display:flex;gap:10px;">
<button style="flex:1;" onclick="calculate()">Рассчитать</button>
<button style="flex:1;" class="btn-secondary" onclick="saveDay()">Сохранить</button>
</div>

<div id="result" class="result"></div>

</div>

<!-- ОТЧЕТЫ -->
<div id="reports" class="page hidden">

<div class="block">
<select id="yearSelect"></select>

<select id="monthSelect">
<option value="0">Январь</option>
<option value="1">Февраль</option>
<option value="2">Март</option>
<option value="3">Апрель</option>
<option value="4">Май</option>
<option value="5">Июнь</option>
<option value="6">Июль</option>
<option value="7">Август</option>
<option value="8">Сентябрь</option>
<option value="9">Октябрь</option>
<option value="10">Ноябрь</option>
<option value="11">Декабрь</option>
</select>

<button onclick="loadReports()">Показать отчет</button>
</div>

<div id="reportList"></div>

<div class="block">
<h3>📊 МЕСЯЧНЫЙ ИТОГ</h3>
<div id="summary"></div>
</div>

</div>

<!-- КАЛЕНДАРЬ -->
<div id="calendar" class="page hidden">

<div class="block">
<h3>📅 Настройка графика</h3>
<input type="date" id="startDate">
<button onclick="generateCalendar()">Создать график 2/2</button>
</div>

<div class="block">
<h3>🔎 Показать период</h3>

<select id="calendarYear"></select>

<select id="calendarMonth">
<option value="0">Январь</option>
<option value="1">Февраль</option>
<option value="2">Март</option>
<option value="3">Апрель</option>
<option value="4">Май</option>
<option value="5">Июнь</option>
<option value="6">Июль</option>
<option value="7">Август</option>
<option value="8">Сентябрь</option>
<option value="9">Октябрь</option>
<option value="10">Ноябрь</option>
<option value="11">Декабрь</option>
</select>

<button onclick="renderCalendar()">Показать</button>
</div>

<div id="calendarList"></div>
</div>

<!-- НАСТРОЙКИ -->
<div id="settings" class="page hidden">

<div class="block">
<h3>⏱ Почасовая ставка</h3>
<input type="number" id="set_hourRate">

<h3>🚛 Стоимость телеги</h3>
<input type="number" id="set_cartRate">

<h3>💰 НДФЛ</h3>
<input type="number" id="set_ndfl" step="0.01">
</div>

<div class="block">
<h3>📦 Тарифы складов</h3>
<div id="ratesList"></div>
</div>

<button onclick="saveSettings()">Сохранить настройки</button>

</div>

<div class="bottom-nav">
<button onclick="nav('calc',this)" class="active">💰</button>
<button onclick="nav('reports',this)">📊</button>
<button onclick="nav('calendar',this)">📅</button>
<button onclick="nav('settings',this)">⚙️</button>
</div>

<script>

let settings=JSON.parse(localStorage.getItem('settings')) || {
    hourRate:150,
    cartRate:100,
    ndfl:0.13,
    rates:{
        "ОС":2.25,
        "Мультиотборка ОС":1.78,
        "Охлажденка":1.37,
        "Мультиотборка охлажденка":1.49,
        "Заморозка":1.72,
        "Мультиотборка заморозка":2.08,
        "Овощи/фрукты":1.86,
        "Мультиотборка овощи/фрукты":1.52,
        "Алкоголь":2.38,
        "Мультиотборка алкоголь":2.06
    }
};

function nav(id,btn){

    document.querySelectorAll('.page').forEach(p=>{
        p.classList.add('hidden');
    });

    document.getElementById(id).classList.remove('hidden');

    document.querySelectorAll('.bottom-nav button').forEach(b=>{
        b.classList.remove('active');
    });

    btn.classList.add('active');

    if(id==='settings'){
        openSettings();
    }
}

function addPick(){

    let div=document.createElement('div');

    let options='';

    for(let k in settings.rates){
        options += `<option>${k}</option>`;
    }

    div.innerHTML=`
    <select>${options}</select>
    <input type="number" placeholder="Количество пиков">
    <button class="btn-secondary" onclick="this.parentElement.remove()">
    Удалить
    </button>
    `;

    document.getElementById('picks').appendChild(div);
}

function calculate(){

    let date=document.getElementById('date').value;

    let calendar=JSON.parse(localStorage.getItem('calendar')) || [];

    let day=calendar.find(d=>d.date===date);

    if(day && day.type==='off'){
        alert('❌ Это выходной день');
        return;
    }

    let hours=+document.getElementById('hours').value || 0;
    let carts=+document.getElementById('carts').value || 0;
    let holiday=document.getElementById('holiday').checked;

    let hourRate=holiday ? settings.hourRate*2 : settings.hourRate;

    let hourSum=hours*hourRate;
    let cartSum=carts*settings.cartRate;

    let picks=[];
    let html='';

    document.querySelectorAll('#picks div').forEach(div=>{

        let type=div.querySelector('select').value;
        let qty=+div.querySelector('input').value || 0;

        let sum=qty*settings.rates[type];

        picks.push({type,qty,sum});

        html += `${type} (${qty}) — ${sum.toFixed(2)} руб<br>`;
    });

    let pickTotal=picks.reduce((a,b)=>a+b.sum,0);

    let total=pickTotal+cartSum+hourSum;

    let final=total-(total*settings.ndfl);

    html += `
    🚛 Телеги (${carts}) — ${cartSum.toFixed(2)} руб<br>
    ⏱ Часы (${hours}) ${holiday ? '(праздничный день ×2)' : ''} — ${hourSum.toFixed(2)} руб<br>
    <hr>
    💰 Итого до НДФЛ: ${total.toFixed(2)} руб<br>
    ✅ Итого после НДФЛ: ${final.toFixed(2)} руб
    `;

    document.getElementById('result').innerHTML=html;

    return {
        date,
        hours,
        carts,
        picks,
        total,
        final,
        holiday
    };
}

function saveDay(){

    let d=calculate();

    if(!d) return;

    let arr=JSON.parse(localStorage.getItem('days')) || [];

    arr.push(d);

    localStorage.setItem('days',JSON.stringify(arr));

    alert('Сохранено');
}

function deleteDay(index){

    let arr=JSON.parse(localStorage.getItem('days')) || [];

    arr.splice(index,1);

    localStorage.setItem('days',JSON.stringify(arr));

    loadReports();
}

function loadReports(){

    let data=JSON.parse(localStorage.getItem('days')) || [];

    let year=+document.getElementById('yearSelect').value;
    let month=+document.getElementById('monthSelect').value;

    let html='';

    let totalAfter=0;

    data.forEach((d,i)=>{

        let dd=new Date(d.date);

        if(dd.getFullYear()!==year || dd.getMonth()!==month) return;

        html += `<div class="block">`;

        html += `<b>${d.date}</b><br><br>`;

        d.picks.forEach(p=>{
            html += `${p.type} (${p.qty}) — ${p.sum.toFixed(2)} руб<br>`;
        });

        let cartSum=d.carts*settings.cartRate;

        let hourRate=d.holiday ? settings.hourRate*2 : settings.hourRate;

        let hourSum=d.hours*hourRate;

        html += `
        🚛 Телеги (${d.carts}) — ${cartSum.toFixed(2)} руб<br>
        ⏱ Часы (${d.hours}) ${d.holiday ? '(праздничный день ×2)' : ''} — ${hourSum.toFixed(2)} руб<br>
        <hr>
        💰 Итого до НДФЛ: ${d.total.toFixed(2)} руб<br>
        ✅ Итого после НДФЛ: ${d.final.toFixed(2)} руб
        `;

        html += `
        <button class="btn-secondary" onclick="deleteDay(${i})">
        Удалить день
        </button>
        `;

        html += `</div>`;

        totalAfter += d.final;
    });

    document.getElementById('reportList').innerHTML=html;

    document.getElementById('summary').innerHTML=`
    💰 Общий доход после НДФЛ: ${totalAfter.toFixed(2)} руб
    `;
}

function generateCalendar(){

    let startValue=document.getElementById('startDate').value;

    if(!startValue){
        alert('Выберите дату');
        return;
    }

    let start=new Date(startValue);

    let days=[];

    for(let i=0;i<3650;i++){

        let d=new Date(start);

        d.setDate(start.getDate()+i);

        let type=(Math.floor(i/2)%2===0)
            ? 'work'
            : 'off';

        days.push({
            date:d.toISOString().split('T')[0],
            type
        });
    }

    localStorage.setItem('calendar',JSON.stringify(days));

    renderCalendar();
}

function renderCalendar(){

    let data=JSON.parse(localStorage.getItem('calendar')) || [];

    let year=+document.getElementById('calendarYear').value;
    let month=+document.getElementById('calendarMonth').value;

    let html='';

    data.forEach((d,i)=>{

        let current=new Date(d.date);

        if(current.getFullYear()!==year || current.getMonth()!==month) return;

        html += `
        <div class="day ${d.type}" onclick="toggleDay(${i})">
        <b>${d.date}</b><br>
        ${d.type==='work' ? '🟢 Рабочий день' : '🔴 Выходной'}
        </div>
        `;
    });

    document.getElementById('calendarList').innerHTML=html;
}

function toggleDay(i){

    let data=JSON.parse(localStorage.getItem('calendar')) || [];

    data[i].type=data[i].type==='work' ? 'off' : 'work';

    localStorage.setItem('calendar',JSON.stringify(data));

    renderCalendar();
}

function openSettings(){

    document.getElementById('set_hourRate').value=settings.hourRate;
    document.getElementById('set_cartRate').value=settings.cartRate;
    document.getElementById('set_ndfl').value=settings.ndfl;

    let html='';

    for(let k in settings.rates){

        html += `
        ${k}
        <input data-type="${k}" value="${settings.rates[k]}">
        `;
    }

    document.getElementById('ratesList').innerHTML=html;
}

function saveSettings(){

    settings.hourRate=+document.getElementById('set_hourRate').value;
    settings.cartRate=+document.getElementById('set_cartRate').value;
    settings.ndfl=+document.getElementById('set_ndfl').value;

    document.querySelectorAll('#ratesList input').forEach(i=>{
        settings.rates[i.dataset.type]=+i.value;
    });

    localStorage.setItem('settings',JSON.stringify(settings));

    alert('Настройки сохранены');
}

window.addEventListener('DOMContentLoaded',()=>{

    if(document.getElementById('picks').children.length===0){
        addPick();
    }

    let yearSelect=document.getElementById('yearSelect');

    for(let y=2025;y<=2100;y++){

        let option=document.createElement('option');

        option.value=y;
        option.text=y;

        yearSelect.appendChild(option);
    }

    yearSelect.value=new Date().getFullYear();

    let calendarYear=document.getElementById('calendarYear');

    for(let y=2025;y<=2100;y++){

        let option=document.createElement('option');

        option.value=y;
        option.text=y;

        calendarYear.appendChild(option);
    }

    calendarYear.value=new Date().getFullYear();

    let currentMonth=new Date().getMonth();

    document.getElementById('monthSelect').value=currentMonth;
    document.getElementById('calendarMonth').value=currentMonth;

    // TELEGRAM
    if(window.Telegram && Telegram.WebApp){

        const tg=Telegram.WebApp;

        tg.ready();
        tg.expand();

        const user=tg.initDataUnsafe.user;

        if(user){
            document.getElementById('userInfo').innerHTML=`
            👋 ${user.first_name}
            ${user.username ? '@'+user.username : ''}
            `;
        }
    }

});

</script>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

</body>
</html>
```
