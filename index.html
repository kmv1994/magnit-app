<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магнит — Зарплата</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f3f3;
color:#111;
}
.header{
background:#e30613;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}
#userInfo{
background:#fff;
padding:10px;
text-align:center;
border-bottom:1px solid #ddd;
}
.page{
padding:15px;
padding-bottom:90px;
}
.hidden{display:none;}
.card{
background:#fff;
padding:15px;
border-radius:18px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}
input,select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:12px;
border:1px solid #ddd;
box-sizing:border-box;
font-size:16px;
-webkit-appearance:auto;
appearance:auto;
background:#fff;
}
button{
background:#e30613;
color:#fff;
border:none;
font-weight:bold;
}
.secondary{
background:#ececec;
color:#111;
}
.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
background:#fff;
border-top:1px solid #ddd;
}
.bottom-nav button{
flex:1;
background:#fff;
color:#666;
border:none;
border-radius:0;
font-size:22px;
}
.bottom-nav .active{
color:#e30613;
font-weight:bold;
}
.day.work{background:#d4edda;}
.day.off{background:#f8d7da;}
.day{
padding:10px;
border-radius:12px;
margin-top:8px;
}
</style>

</head>
<body>

<div class="header">📦 Зарплата кладовщика / отборщика Магнит</div>
<div id="userInfo">Загрузка пользователя...</div>

<div id="calc" class="page">

<div class="card">
<input type="date" id="date">
<input type="number" id="hours" placeholder="Количество часов">
<label>
<input type="checkbox" id="holiday" style="width:auto;">
🎉 Праздничный день (часы ×2)
</label>
</div>

<div class="card">
<h3>📦 Пики</h3>
<div id="picks"></div>
<button onclick="addPick()">Добавить склад</button>
</div>

<div class="card">
<h3>🚛 Развоз телег</h3>
<input type="number" id="carts" placeholder="Количество телег">
</div>

<div class="card">
<button onclick="calculate()">Рассчитать</button>
<button class="secondary" onclick="saveDay()">Сохранить</button>
</div>

<div class="card" id="result"></div>
</div>

<div id="reports" class="page hidden">
<div class="card">
<select id="yearSelect"></select>
<select id="monthSelect">
<option value="0">Январь</option>
<option value="1">Февраль</option>
<option value="2">Март</option>
<option value="3">Апрель</option>
<option value="4">Май</option>
<option value="5">Июнь</option>
<option value="6">Июль</option>
<option value="7">Август</option>
<option value="8">Сентябрь</option>
<option value="9">Октябрь</option>
<option value="10">Ноябрь</option>
<option value="11">Декабрь</option>
</select>
<button onclick="loadReports()">Показать отчет</button>
<button onclick="exportExcel()">📥 Excel</button>
</div>

<div id="reportList"></div>

<div class="card">
<h3>📊 МЕСЯЧНЫЙ ИТОГ</h3>
<div id="summary"></div>
</div>

<div class="card">
<h3>📈 ПРОГНОЗ</h3>
<div id="forecast"></div>
</div>
</div>

<div id="calendar" class="page hidden">
<div class="card">
<input type="date" id="startDate">
<button onclick="generateCalendar()">Создать график 2/2</button>
</div>

<div class="card">
<select id="calendarYear"></select>
<select id="calendarMonth">
<option value="0">Январь</option>
<option value="1">Февраль</option>
<option value="2">Март</option>
<option value="3">Апрель</option>
<option value="4">Май</option>
<option value="5">Июнь</option>
<option value="6">Июль</option>
<option value="7">Август</option>
<option value="8">Сентябрь</option>
<option value="9">Октябрь</option>
<option value="10">Ноябрь</option>
<option value="11">Декабрь</option>
</select>
<button onclick="renderCalendar()">Показать</button>
</div>

<div id="calendarList"></div>
</div>

<div id="settings" class="page hidden">
<div class="card">
<h3>⏱ Почасовая ставка</h3>
<input type="number" id="set_hourRate">

<h3>🚛 Стоимость телеги</h3>
<input type="number" id="set_cartRate">

<h3>💰 НДФЛ</h3>
<input type="number" id="set_ndfl" step="0.01">
</div>

<div class="card">
<h3>📦 Тарифы складов</h3>
<div id="ratesList"></div>
</div>

<button onclick="saveSettings()">Сохранить настройки</button>

</div>

<div class="bottom-nav">
<button class="active" onclick="nav('calc',this)">💰</button>
<button onclick="nav('reports',this)">📊</button>
<button onclick="nav('calendar',this)">📅</button>
<button onclick="nav('settings',this)">⚙️</button>
</div>

<script>

let TG_USER_ID='guest';

function userKey(key){
return key+'_'+TG_USER_ID;
}

function loadUserSettings(){

settings=JSON.parse(
localStorage.getItem(userKey('settings'))
) || {
hourRate:139,
cartRate:8,
ndfl:0.13,
rates:{
"ОС":2.25,
"Мультиотборка ОС":1.78,
"Охлажденка":1.37,
"Мультиотборка охлажденка":1.49,
"Заморозка":1.72,
"Мультиотборка заморозка":2.08,
"Овощи/фрукты":1.86,
"Мультиотборка овощи/фрукты":1.52,
"Алкоголь":2.38,
"Мультиотборка алкоголь":2.06
}
};
}

let settings={};

function nav(id,btn){
document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
document.getElementById(id).classList.remove('hidden');
document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
if(id==='settings') openSettings();
}

function addPick(){
let div=document.createElement('div');
let options='';
Object.keys(settings.rates).forEach(k=>{
options+=`<option value="${k}">${k}</option>`;
});

div.innerHTML=`
<select class="pickType">${options}</select>
<input type="number" class="pickQty" placeholder="Количество пиков">
<button class="secondary" onclick="this.parentElement.remove()">Удалить склад</button>
`;

document.getElementById('picks').appendChild(div);
}

function calculate(){
let date=document.getElementById('date').value;
let hours=+document.getElementById('hours').value||0;
let carts=+document.getElementById('carts').value||0;
let holiday=document.getElementById('holiday').checked;

let calendar=JSON.parse(localStorage.getItem(userKey('calendar')))||[];
let found=calendar.find(d=>d.date===date);

if(found && found.type==='off'){
alert('Это выходной день');
return;
}

let picks=[];
let html='';
let pickTotal=0;

let hourRate=holiday?settings.hourRate*2:settings.hourRate;
let hourSum=hours*hourRate;
let cartSum=carts*settings.cartRate;

document.querySelectorAll('#picks > div').forEach(div=>{
let type=div.querySelector('.pickType').value;
let qty=+div.querySelector('.pickQty').value||0;
let sum=qty*settings.rates[type];

pickTotal+=sum;

picks.push({type,qty,sum});

html+=`${type} (${qty}) — ${sum.toFixed(2)} руб<br>`;
});

let total=pickTotal+hourSum+cartSum;
let final=total-(total*settings.ndfl);

html+=`
🚛 Телеги (${carts}) — ${cartSum.toFixed(2)} руб<br>
⏱ Часы (${hours}) — ${hourSum.toFixed(2)} руб<br>
<hr>
💰 Итого до НДФЛ: ${total.toFixed(2)} руб<br>
✅ Итого после НДФЛ: ${final.toFixed(2)} руб
`;

document.getElementById('result').innerHTML=html;

return {date,hours,carts,picks,total,final,holiday};
}

function saveDay(){
let d=calculate();
if(!d)return;
let arr=JSON.parse(localStorage.getItem(userKey('days')))||[];
arr.push(d);
localStorage.setItem(userKey('days'),JSON.stringify(arr));
alert('Сохранено');
}

function deleteDay(index){
let arr=JSON.parse(localStorage.getItem(userKey('days')))||[];
arr.splice(index,1);
localStorage.setItem(userKey('days'),JSON.stringify(arr));
loadReports();
}

function loadReports(){
let data=JSON.parse(localStorage.getItem(userKey('days')))||[];
let year=+document.getElementById('yearSelect').value;
let month=+document.getElementById('monthSelect').value;

let html='';
let totalAfter=0;
let totalBefore=0;
let totalHours=0;
let totalCarts=0;
let warehouseTotals={};

let workedDays=0;

data.forEach((d,i)=>{
let dt=new Date(d.date);
if(dt.getFullYear()!==year||dt.getMonth()!==month)return;

workedDays++;

totalAfter+=d.final;
totalBefore+=d.total;
totalHours+=d.hours;
totalCarts+=d.carts;

html+=`<div class="card"><b>${d.date}</b><br><br>`;

d.picks.forEach(p=>{
html+=`${p.type} (${p.qty}) — ${p.sum.toFixed(2)} руб<br>`;

if(!warehouseTotals[p.type]){
warehouseTotals[p.type]={qty:0,sum:0};
}
warehouseTotals[p.type].qty+=p.qty;
warehouseTotals[p.type].sum+=p.sum;
});

html+=`
🚛 Телеги (${d.carts}) — ${(d.carts*settings.cartRate).toFixed(2)} руб<br>
⏱ Часы (${d.hours}) — ${(d.hours*settings.hourRate).toFixed(2)} руб<br>
<hr>
💰 Итого до НДФЛ: ${d.total.toFixed(2)} руб<br>
✅ Итого после НДФЛ: ${d.final.toFixed(2)} руб
<button class="secondary" onclick="deleteDay(${i})">Удалить день</button>
</div>`;
});

document.getElementById('reportList').innerHTML=html;

let summary='';

for(let k in warehouseTotals){
summary+=`${k} (${warehouseTotals[k].qty}) — ${warehouseTotals[k].sum.toFixed(2)} руб<br>`;
}

summary+=`
<br>
🚛 Телеги (${totalCarts}) — ${(totalCarts*settings.cartRate).toFixed(2)} руб<br>
⏱ Часы (${totalHours}) — ${(totalHours*settings.hourRate).toFixed(2)} руб<br>
<hr>
💰 Итого до НДФЛ: ${totalBefore.toFixed(2)} руб<br>
✅ Итого после НДФЛ: ${totalAfter.toFixed(2)} руб
`;

document.getElementById('summary').innerHTML=summary;

let calendar=JSON.parse(localStorage.getItem(userKey('calendar')))||[];

let workDays=calendar.filter(d=>{
let dt=new Date(d.date);
return dt.getFullYear()===year && dt.getMonth()===month && d.type==='work';
}).length;

let avg=workedDays?totalAfter/workedDays:0;
let forecast=avg*workDays;

document.getElementById('forecast').innerHTML=`
Средний заработок за смену: ${avg.toFixed(2)} руб<br>
Рабочих дней по графику: ${workDays}<br>
Прогноз зарплаты: ${forecast.toFixed(2)} руб
`;
}

function generateCalendar(){
let start=document.getElementById('startDate').value;
if(!start)return;

let base=new Date(start);
let arr=[];

for(let i=0;i<3650;i++){
let d=new Date(base);
d.setDate(base.getDate()+i);

let type=(Math.floor(i/2)%2===0)?'work':'off';

arr.push({
date:d.toISOString().split('T')[0],
type
});
}

localStorage.setItem(userKey('calendar'),JSON.stringify(arr));
renderCalendar();
}

function renderCalendar(){
let data=JSON.parse(localStorage.getItem(userKey('calendar')))||[];
let year=+document.getElementById('calendarYear').value;
let month=+document.getElementById('calendarMonth').value;

let html='';

data.forEach((d,i)=>{
let dt=new Date(d.date);
if(dt.getFullYear()!==year||dt.getMonth()!==month)return;

html+=`<div class="day ${d.type}" onclick="toggleDay(${i})">
<b>${d.date}</b><br>
${d.type==='work'?'🟢 Рабочий':'🔴 Выходной'}
</div>`;
});

document.getElementById('calendarList').innerHTML=html;
}

function toggleDay(i){
let data=JSON.parse(localStorage.getItem(userKey('calendar')))||[];
data[i].type=data[i].type==='work'?'off':'work';
localStorage.setItem(userKey('calendar'),JSON.stringify(data));
renderCalendar();
}

function openSettings(){
document.getElementById('set_hourRate').value=settings.hourRate;
document.getElementById('set_cartRate').value=settings.cartRate;
document.getElementById('set_ndfl').value=settings.ndfl;

let html='';

for(let k in settings.rates){
html+=`${k}<input data-type="${k}" value="${settings.rates[k]}">`;
}

document.getElementById('ratesList').innerHTML=html;
}

function saveSettings(){
settings.hourRate=+document.getElementById('set_hourRate').value;
settings.cartRate=+document.getElementById('set_cartRate').value;
settings.ndfl=+document.getElementById('set_ndfl').value;

document.querySelectorAll('#ratesList input').forEach(i=>{
settings.rates[i.dataset.type]=+i.value;
});

localStorage.setItem(userKey('settings'),JSON.stringify(settings));
alert('Сохранено');
}

function exportExcel(){

    let data = JSON.parse(
        localStorage.getItem(
            userKey('days')
        )
    ) || [];

    if(data.length===0){

        alert('Нет данных для экспорта');

        return;
    }

    let rows=[];

    data.forEach(d=>{

        d.picks.forEach(p=>{

            rows.push({
                'Дата': d.date,
                'Тип': p.type,
                'Количество': p.qty,
                'Сумма': Number(p.sum.toFixed(2))
            });

        });

        rows.push({
            'Дата': d.date,
            'Тип': 'Телеги',
            'Количество': d.carts,
            'Сумма': Number(
                (
                    d.carts *
                    settings.cartRate
                ).toFixed(2)
            )
        });

        rows.push({
            'Дата': d.date,
            'Тип': 'Часы',
            'Количество': d.hours,
            'Сумма': Number(
                (
                    d.hours *
                    settings.hourRate
                ).toFixed(2)
            )
        });

        rows.push({
            'Дата': d.date,
            'Тип': 'ИТОГО ДО НДФЛ',
            'Количество': '',
            'Сумма': Number(
                d.total.toFixed(2)
            )
        });

        rows.push({
            'Дата': d.date,
            'Тип': 'ИТОГО ПОСЛЕ НДФЛ',
            'Количество': '',
            'Сумма': Number(
                d.final.toFixed(2)
            )
        });

    });

    const worksheet =
    XLSX.utils.json_to_sheet(rows);

    const workbook =
    XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        'Отчет'
    );

    const excelBuffer =
    XLSX.write(
        workbook,
        {
            bookType:'xlsx',
            type:'array'
        }
    );

    const blob =
    new Blob(
        [excelBuffer],
        {
            type:
            'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        }
    );

    const url =
    URL.createObjectURL(blob);

    const a =
    document.createElement('a');

    a.href=url;

    a.download='magnit_report.xlsx';

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);
}

window.addEventListener('DOMContentLoaded',()=>{

    // ГОДА
    const currentYear=new Date().getFullYear();
    const currentMonth=new Date().getMonth();

    for(let y=2025;y<=2100;y++){

        const o1=document.createElement('option');
        o1.value=y;
        o1.textContent=y;
        document.getElementById('yearSelect').appendChild(o1);

        const o2=document.createElement('option');
        o2.value=y;
        o2.textContent=y;
        document.getElementById('calendarYear').appendChild(o2);
    }

    document.getElementById('yearSelect').value=currentYear;
    document.getElementById('calendarYear').value=currentYear;
    document.getElementById('monthSelect').value=currentMonth;
    document.getElementById('calendarMonth').value=currentMonth;

    // TELEGRAM
    try{

        if(window.Telegram && window.Telegram.WebApp){

            const tg=window.Telegram.WebApp;

            tg.ready();
            tg.expand();

            const user=tg.initDataUnsafe?.user;

            if(user && user.id){

                TG_USER_ID=String(user.id);

                document.getElementById('userInfo').innerHTML=`👋 ${user.first_name || ''} ${user.username ? '@'+user.username : ''}`;

            }else{

                TG_USER_ID='guest';

                document.getElementById('userInfo').innerHTML='👤 Telegram пользователь';
            }

        }else{

            TG_USER_ID='browser';

            document.getElementById('userInfo').innerHTML='🌐 Режим браузера';
        }

    }catch(e){

        console.log(e);

        TG_USER_ID='error';

        document.getElementById('userInfo').innerHTML='⚠️ Ошибка Telegram';
    }

    // ЗАГРУЗКА ДАННЫХ
    loadUserSettings();
    openSettings();

    // ПЕРВЫЙ СКЛАД
    if(document.getElementById('picks').children.length===0){
        addPick();
    }

});

</script>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

</body>
</html>
